name: Build Ledge APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unzip project if uploaded as a zip
        run: |
          if ls *.zip >/dev/null 2>&1; then
            mkdir -p project
            unzip -q -o *.zip -d project
          fi

      - name: Build release APK
        run: |
          cat > "$HOME/release.init.gradle" <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  if (p.plugins.hasPlugin('com.android.application')) {
                      p.android.buildTypes.release {
                          signingConfig p.android.signingConfigs.debug
                          minifyEnabled false
                      }
                  }
              }
          }
          EOF
          SETTINGS=$(find . -name "settings.gradle*" -not -path "./.git/*" | head -n 1)
          cd "$(dirname "$SETTINGS")"
          gradle assembleRelease --no-daemon --init-script "$HOME/release.init.gradle"

      - uses: actions/upload-artifact@v4
        with:
          name: Ledge-APK
          path: "**/build/outputs/apk/release/*.apk"
